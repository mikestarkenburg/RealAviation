<!DOCTYPE html>
<html>
<head lang="en">
  <meta charset="utf-8" />
  <title>ATIS Settings</title>
  <script src="sdpi-components.js"></script>
</head>
<body>

  <!-- Primary Airport -->
  <sdpi-item label="Airport">
    <sdpi-textfield setting="primaryAirport" placeholder="KSFO" maxlength="4"></sdpi-textfield>
  </sdpi-item>

  <!-- Time Format -->
  <sdpi-item label="Time Format">
    <sdpi-select setting="timeFormat">
      <option value="zulu">Zulu (UTC)</option>
      <option value="local">Local Time</option>
    </sdpi-select>
  </sdpi-item>

  <!-- Refresh Interval -->
  <sdpi-item label="Refresh (sec)">
    <sdpi-range setting="refreshInterval" min="30" max="300" step="30" default="60" showlabels></sdpi-range>
  </sdpi-item>

</body>
</html>
