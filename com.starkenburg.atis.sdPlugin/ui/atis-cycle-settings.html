<!DOCTYPE html>
<html>
<head lang="en">
  <meta charset="utf-8" />
  <title>Cycle Airports Settings</title>
  <script src="sdpi-components.js"></script>
</head>
<body>

  <!-- Airport List -->
  <sdpi-item label="Airports">
    <sdpi-textfield setting="airportsStr" placeholder="KSFO, KLAX, KJFK, KORD"></sdpi-textfield>
  </sdpi-item>

  <!-- Refresh Interval -->
  <sdpi-item label="Refresh (sec)">
    <sdpi-range setting="refreshInterval" min="30" max="300" step="30" default="60" showlabels></sdpi-range>
  </sdpi-item>

</body>
</html>
